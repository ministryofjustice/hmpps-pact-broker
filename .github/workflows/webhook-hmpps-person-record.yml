name: Webhooks

on:
  workflow_dispatch:

jobs:
  apply_webhooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Generate Token
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.INTEGRATION_TESTS_TRIGGER_APP_ID }}
          private-key: ${{ secrets.INTEGRATION_TESTS_TRIGGER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          repositories: hmpps-person-record
      - name: Apply webhooks
        env:
          hmpps-person-record_ACCESS_TOKEN: ${{ steps.generate-token.outputs.token }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
        run: ./create-single-webhook.sh ${{ inputs.provider_name }} ctNyAoj2Rx6pJYuJSpYChw hmpps-person-record_ACCESS_TOKEN
        working-directory: ./seed
